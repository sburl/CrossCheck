name: Security Gates (Nightly)

on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run repository secret scan (repo + history + logs)
        run: |
          bash scripts/scan-secrets.sh --all
