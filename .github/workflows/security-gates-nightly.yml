name: Security Gates (Nightly)

on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run repository secret scan (repo + history + logs)
        run: |
          bash scripts/scan-secrets.sh --all
